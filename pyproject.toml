[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-reliability-platform"
version = "0.1.0"
description = "A production-ready platform for evaluating and improving LLM reliability."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Mukul Mangal" }
]
[tool.black]
line-length = 88
target-version = ["py311"]
[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]